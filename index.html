<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Refrigerios - PROFE Bolivia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería HTML5 QR Code para la cámara -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Librería SheetJS (XLSX) para Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bolivia-blue': '#1E293B',
                        'bolivia-cyan': '#0EA5E9',
                        'bolivia-gold': '#FBBF24', // Dorado institucional
                        'bg-dark': '#0F172A',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full font-sans text-slate-100 flex flex-col antialiased">

    <!-- HEADER RESPONSIVO -->
    <header class="bg-bolivia-blue border-b border-slate-700 shadow-lg p-3 flex justify-between items-center gap-4 z-50 sticky top-0">
        <div class="flex items-center gap-3">
            <img src="escudo.png" alt="Escudo de Bolivia" class="h-10 w-auto object-contain" onerror="this.style.display='none';">
            <div>
                <h1 class="text-xs font-bold text-white tracking-wider">MINISTERIO DE EDUCACIÓN</h1>
                <p class="text-[9px] text-slate-300">ESTADO PLURINACIONAL DE BOLIVIA</p>
            </div>
            <div class="hidden sm:block border-l pl-3 border-slate-600">
                <span class="text-xs font-bold text-bolivia-gold tracking-widest">PROFE</span>
                <span class="text-[10px] text-slate-300 block">Control de Refrigerios</span>
            </div>
        </div>
        
        <div id="user-info" class="text-sm text-slate-300 hidden items-center gap-3">
            <span id="user-email" class="text-slate-100 font-medium text-xs truncate max-w-[120px]"></span> 
            <button onclick="cerrarSesion()" class="bg-red-800/70 hover:bg-red-700 text-red-100 px-3 py-1.5 rounded-full text-[10px] font-semibold transition">Salir</button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow p-4 sm:p-6 flex flex-col items-center justify-center bg-bg-dark">

        <!-- PANTALLA 1: LOGIN ADMINISTRADOR -->
        <div id="login-section" class="bg-slate-900 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800 transition-all duration-500">
            <div class="mb-8 text-center">
                <div class="text-4xl font-extrabold text-bolivia-gold mb-1 tracking-tight drop-shadow">PROFE</div>
                <p class="text-xs text-slate-300 font-semibold uppercase tracking-wider">Programa de Formación Especializada</p>
                <p class="text-[11px] text-slate-400 mt-1">Panel de Control Seguro</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Correo Administrador</label>
                    <input type="email" id="email" required placeholder="admin@minedu.gob.bo" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white text-sm focus:ring-2 focus:ring-bolivia-gold focus:border-bolivia-gold outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white text-sm focus:ring-2 focus:ring-bolivia-gold focus:border-bolivia-gold outline-none transition">
                </div>
                <button type="submit" class="w-full bg-bolivia-gold hover:bg-amber-400 text-slate-950 font-extrabold p-3.5 rounded-xl text-sm transition duration-300 shadow-lg">Ingresar al Sistema</button>
                <p id="login-error" class="text-red-400 text-xs text-center hidden mt-2"></p>
            </form>
        </div>

        <!-- PANTALLA 2: APLICACIÓN (ESCANER Y GESTIÓN) -->
        <div id="app-section" class="hidden w-full max-w-4xl grid grid-cols-1 lg:grid-cols-3 gap-6 transition-all duration-500">
            
            <!-- COLUMNA IZQUIERDA: ADMINISTRACIÓN -->
            <div class="lg:col-span-1 space-y-5 order-2 lg:order-1">
                <div class="bg-bolivia-blue p-5 rounded-3xl shadow-xl border border-slate-700 space-y-4">
                    <h3 class="text-xs font-extrabold text-bolivia-gold uppercase tracking-widest flex items-center gap-2">
                        <span>⚡</span> GESTIÓN Y REPORTES
                    </h3>
                    
                    <div class="grid grid-cols-1 gap-2.5">
                        <button onclick="descargarPlantillaExcel()" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs py-2.5 px-3 rounded-xl border border-slate-600 transition flex items-center justify-center gap-2 font-medium">
                            📥 Descargar Plantilla Excel
                        </button>
                        <button onclick="descargarReporteExcel()" class="bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 text-xs py-2.5 px-3 rounded-xl border border-emerald-800 transition flex items-center justify-center gap-2 font-medium">
                            📊 Reporte de Entregas
                        </button>
                        <button onclick="confirmarReinicio()" class="bg-amber-950/60 hover:bg-amber-900/80 text-amber-300 text-xs py-2.5 px-3 rounded-xl border border-amber-800 transition flex items-center justify-center gap-2 font-medium">
                            🔄 Reiniciar Jornada
                        </button>
                    </div>

                    <!-- CARGA DE EXCEL -->
                    <div class="pt-3 border-t border-slate-600">
                        <label class="block text-xs text-slate-300 font-medium mb-1.5">Cargar Padrón (.xlsx, .csv):</label>
                        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" onchange="procesarExcel(event)" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-bolivia-gold file:text-slate-950 hover:file:bg-amber-400 cursor-pointer bg-slate-800 rounded-xl p-1.5 border border-slate-700">
                    </div>
                </div>

                <!-- RESULTADO DE LA VALIDACIÓN -->
                <div id="result-box" class="hidden p-5 rounded-3xl text-center border transition-all shadow-2xl">
                    <p id="result-title" class="text-xl font-extrabold tracking-tight"></p>
                    <p id="result-name" class="text-base font-bold mt-2 text-white"></p>
                    <p id="result-details" class="text-xs mt-1 opacity-90"></p>
                    <button onclick="reiniciarEscanner()" class="mt-4 bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-full text-xs font-semibold transition mx-auto flex items-center gap-1">
                        Escanear Siguiente
                    </button>
                </div>
            </div>

            <!-- COLUMNA DERECHA: ESCÁNER -->
            <div class="lg:col-span-2 order-1 lg:order-2">
                <div class="bg-bolivia-blue p-5 rounded-3xl shadow-2xl border border-slate-700 flex flex-col items-center">
                    <div class="w-full flex items-center justify-between mb-3 border-b border-slate-600 pb-3">
                        <h3 class="text-sm font-bold text-white tracking-tight flex items-center gap-2">
                            <span class="text-bolivia-gold">📷</span> Escáner de Código QR
                        </h3>
                        <span class="text-[10px] font-mono bg-slate-900 px-2.5 py-1 rounded-full text-bolivia-gold border border-slate-700">Cámara Trasera</span>
                    </div>
                    
                    <div id="reader" class="w-full max-w-xs aspect-square rounded-2xl overflow-hidden border-2 border-bolivia-gold/50 bg-black shadow-inner relative">
                        <div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
                            <div class="w-3/4 h-3/4 border-2 border-dashed border-bolivia-gold/80 rounded-2xl"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-bolivia-blue border-t border-slate-700 text-center py-2 text-[10px] text-slate-400 z-50">
        © 2026 Programa <span class="text-bolivia-gold font-bold">PROFE</span> - Ministerio de Educación - Estado Plurinacional de Bolivia
    </footer>

    <!-- SCRIPT DE FIREBASE Y LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYL6LrCODSyctVDYlde8PilNmSfM_fqb4",
            authDomain: "control-refrigerios-profe.firebaseapp.com",
            databaseURL: "https://control-refrigerios-profe-default-rtdb.firebaseio.com",
            projectId: "control-refrigerios-profe",
            storageBucket: "control-refrigerios-profe.firebasestorage.app",
            messagingSenderId: "738331553720",
            appId: "1:738331553720:web:ba584bc435ee22ffdf294d",
            measurementId: "G-MD900C2HLB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let html5QrCode = null;
        let scannerIsRunning = false;
        let lastResult;

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorElement = document.getElementById('login-error');
            const loginBtn = e.target.querySelector('button');

            try {
                errorElement.classList.add('hidden');
                loginBtn.textContent = "Validando...";
                loginBtn.disabled = true;

                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorElement.textContent = "Correo o contraseña incorrectos.";
                errorElement.classList.remove('hidden');
            } finally {
                loginBtn.textContent = "Ingresar al Sistema";
                loginBtn.disabled = false;
            }
        };

        window.cerrarSesion = function() {
            if (confirm("¿Cerrar sesión de administrador?")) {
                signOut(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginSection = document.getElementById('login-section');
            const appSection = document.getElementById('app-section');
            const userInfo = document.getElementById('user-info');
            const userEmailSpan = document.getElementById('user-email');

            if (user) {
                loginSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userInfo.classList.add('flex');
                userEmailSpan.textContent = user.email;
                iniciarEscanner();
            } else {
                loginSection.classList.remove('hidden');
                appSection.classList.add('hidden');
                userInfo.classList.add('hidden');
                userInfo.classList.remove('flex');
                
                if (scannerIsRunning && html5QrCode) {
                    html5QrCode.stop().then(() => { scannerIsRunning = false; }).catch(err => console.log(err));
                }
            }
        });

        function onScanSuccess(decodedText) {
            if (decodedText !== lastResult) {
                lastResult = decodedText;
                if (scannerIsRunning) {
                    html5QrCode.pause();
                    scannerIsRunning = false;
                }
                verificarYEntregarRefrigerio(decodedText.trim());
            }
        }

        function iniciarEscanner() {
            if (scannerIsRunning) return;
            const config = {
                fps: 5,
                qrbox: { width: 200, height: 200 },
                aspectRatio: 1.0,
                videoConstraints: { facingMode: "environment" }
            };

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
                .then(() => { scannerIsRunning = true; })
                .catch(err => console.error("Error cámara: ", err));
        }

        window.reiniciarEscanner = function() {
            const resultBox = document.getElementById('result-box');
            resultBox.classList.add('hidden');
            resultBox.classList.remove('bg-emerald-950', 'border-emerald-600', 'bg-red-950', 'border-red-600', 'bg-amber-950');
            
            if (html5QrCode && !scannerIsRunning) {
                lastResult = undefined;
                html5QrCode.resume();
                scannerIsRunning = true;
            }
        };

        async function verificarYEntregarRefrigerio(id) {
            const resultBox = document.getElementById('result-box');
            const resultTitle = document.getElementById('result-title');
            const resultName = document.getElementById('result-name');
            const resultDetails = document.getElementById('result-details');

            resultBox.classList.remove('hidden', 'bg-emerald-950', 'border-emerald-600', 'bg-red-950', 'border-red-600', 'bg-amber-950');
            resultTitle.textContent = "Verificando...";
            resultName.textContent = id;
            resultDetails.textContent = "Buscando en la base de datos...";
            resultBox.classList.add('bg-slate-800', 'border-slate-600', 'text-slate-300');

            try {
                const participanteRef = ref(db, 'participantes/' + id);
                const snapshot = await get(participanteRef);

                resultBox.classList.remove('bg-slate-800', 'border-slate-600', 'text-slate-300');

                if (!snapshot.exists()) {
                    resultBox.classList.add('bg-red-950', 'border-red-600', 'text-red-100');
                    resultTitle.textContent = "❌ CÓDIGO INVÁLIDO";
                    resultName.textContent = `ID: ${id}`;
                    resultDetails.textContent = "Este código QR no pertenece al padrón oficial.";
                } else {
                    const data = snapshot.val();

                    if (data.entregado === true) {
                        resultBox.classList.add('bg-amber-950', 'border-yellow-600', 'text-yellow-100');
                        resultTitle.textContent = "⚠️ ¡ENTREGA DOBLE!";
                        resultName.textContent = data.nombre || "Participante";
                        resultDetails.textContent = `Ya retiró su refrigerio a las: ${data.horaEntrega || '---'}.`;
                    } else {
                        const horaActual = new Date().toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit' });
                        await update(participanteRef, {
                            entregado: true,
                            horaEntrega: horaActual
                        });

                        resultBox.classList.add('bg-emerald-950', 'border-emerald-600', 'text-emerald-100');
                        resultTitle.textContent = "✅ ¡AUTORIZADO!";
                        resultName.textContent = data.nombre || "Participante";
                        resultDetails.textContent = `Refrigerio entregado a las ${horaActual} Hrs.`;
                    }
                }
            } catch (error) {
                resultBox.classList.add('bg-red-950', 'border-red-600', 'text-red-100');
                resultTitle.textContent = "❌ ERROR";
                resultName.textContent = "Fallo de conexión";
                resultDetails.textContent = error.message;
            }
        }

        window.descargarPlantillaExcel = function() {
            const templateData = [
                { id: "7654321", nombre: "QUISPE MAMANI, CARLOS" },
                { id: "1234567", nombre: "MOLINA VARGAS, ANA" }
            ];
            const worksheet = XLSX.utils.json_to_sheet(templateData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Participantes");
            XLSX.writeFile(workbook, "plantilla_participantes_profe.xlsx");
        };

        // Descargar Reporte Completo de Entregas
        window.descargarReporteExcel = async function() {
            try {
                const participantesRef = ref(db, 'participantes');
                const snapshot = await get(participantesRef);
                
                if (!snapshot.exists()) {
                    alert("No hay registros en la base de datos.");
                    return;
                }

                let reportData = [];
                snapshot.forEach((child) => {
                    const data = child.val();
                    reportData.push({
                        "C.I. / ID": child.key,
                        "Nombre Completo": data.nombre || "Sin Nombre",
                        "Estado": data.entregado ? "ENTREGADO" : "NO ENTREGADO",
                        "Hora de Entrega": data.horaEntrega || "---"
                    });
                });

                const worksheet = XLSX.utils.json_to_sheet(reportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Reporte Entregas");
                XLSX.writeFile(workbook, `reporte_refrigerios_${new Date().toISOString().slice(0,10)}.xlsx`);
            } catch (error) {
                alert("Error al generar el reporte: " + error.message);
            }
        };

        window.procesarExcel = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (jsonRows.length === 0) {
                        alert("El archivo Excel está vacío.");
                        return;
                    }

                    if (!confirm(`Se encontraron ${jsonRows.length} registros. ¿Desea subirlos?`)) {
                        event.target.value = "";
                        return;
                    }

                    let updates = {};
                    let contador = 0;

                    for (let row of jsonRows) {
                        let idVal = String(row.id || row.C_I || row.CI || row.carnet || "").trim();
                        let nombreVal = String(row.nombre || row.Nombres || "").trim();

                        if (idVal && idVal !== "nan" && nombreVal && nombreVal !== "nan") {
                            updates['participantes/' + idVal] = {
                                nombre: nombreVal,
                                entregado: false,
                                horaEntrega: ""
                            };
                            contador++;
                        }
                    }

                    await update(ref(db), updates);
                    alert(`¡Carga exitosa! ${contador} participantes registrados.`);
                    event.target.value = "";
                } catch (error) {
                    alert("Error al procesar: " + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.confirmarReinicio = async function() {
            if (!confirm("⚠️ ¿Desea reiniciar los estados de entrega del día?")) return;
            try {
                const participantesRef = ref(db, 'participantes');
                const snapshot = await get(participantesRef);
                
                if (snapshot.exists()) {
                    let updates = {};
                    let count = 0;
                    snapshot.forEach((child) => {
                        const key = child.key;
                        updates[`participantes/${key}/entregado`] = false;
                        updates[`participantes/${key}/horaEntrega`] = "";
                        count++;
                    });
                    await update(ref(db), updates);
                    alert(`¡Jornada reiniciada! ${count} participantes habilitados nuevamente.`);
                } else {
                    alert("No hay registros.");
                }
            } catch (error) {
                alert("Error: " + error.message);
            }
        };
    </script>
</body>
</html>
